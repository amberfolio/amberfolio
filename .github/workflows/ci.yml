# SPDX-License-Identifier: AGPL-3.0-only
name: ci
on: [push, pull_request]
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: content guard (every commit + working tree)
        run: bash scripts/check-clean.sh
      - name: DCO check (every commit)
        run: bash scripts/check-dco.sh
