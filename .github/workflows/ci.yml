# SPDX-License-Identifier: AGPL-3.0-only
name: ci
on:
  # main only. An unrestricted `push:` runs this whole workflow a second
  # time for every push to a branch that already has a pull request open —
  # same tree, same four targets, same 323 vector files — and a duplicate
  # run reports the same check names, so its in-progress copies can block
  # a merge whose checks have all already passed on that very commit (#61).
  # A branch pushed without a pull request now gets no run until one is
  # opened, which is the intended trade: work that is not up for review
  # does not need four targets built.
  #
  # Tags are the exception, and a deliberate one: a `v*` tag is what
  # publishes a Release (#200), and a tag is pushed rarely and on purpose,
  # so the second full matrix run it costs is the price of shipping bytes
  # that every gate below has just agreed about.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]
  #
  # A tag pushed *before* this workflow could release one is release.yml's
  # job, not this file's. Naming an old tag here was tried and is a
  # mistake worth recording: the workflow comes from the ref it was
  # dispatched on and the tree comes from the tag, so `main`'s gates run
  # against a tree that predates them. v0.2.0's run failed three ways — a
  # self-test script that does not exist at that tag, and
  # `sdl-host-records-and-replays` on two targets, which is a bug fixed
  # *after* v0.2.0 and only visible under the `--parallel 4` this file
  # adopted after it too. None of that is a fact about the bytes; it is
  # today's gates asked yesterday's question.

# The conformance vector cache (issue #14). Written out here rather than
# taken from a job output because every job that restores it needs it,
# and threading one string through the job graph is more machinery than
# the string is worth. It must equal what the fetch script computes from
# the suite pin and the condenser version — the `vectors` job asserts
# exactly that and fails loudly if the two ever drift, so the literal
# cannot go stale unnoticed.
env:
  CONFORMANCE_CACHE_KEY: conformance-v2-aea84484abc7-c1

  # What every job checks out, in one place because seven of them do it and
  # a ref that differs between two of them is a release whose manifest
  # describes a build that never happened.
  #
  # `github.sha` is deliberately *not* the whole answer. On a pull request
  # it is GitHub's synthetic merge commit, which carries no Signed-off-by
  # and is not the tree the contributor wrote — hence the head sha. And on
  # a tag push it is the annotated tag object's own sha, not the commit's:
  # forty lowercase hex characters that look exactly like a commit,
  # resolve to no tree, and would have gone straight into both the page's
  # §13 source link and the release manifest's `sourceCommit`. Name the
  # ref there and let git peel it.
  BUILD_REF: ${{ github.event.pull_request.head.sha || startsWith(github.ref, 'refs/tags/') && github.ref || github.sha }}

# Every job below carries a `timeout-minutes:`. GitHub's default is 360,
# which is less a timeout than an afternoon: a step that hangs — and the
# apt install of SDL3's backend headers has, on three separate runs —
# leaves a job that looks alive for six hours and then fails with nothing
# in the log to explain it, long after whoever pushed has stopped
# watching. The numbers are several times the slowest healthy run of each
# job, cold caches included, so they cannot fire on a slow day; they exist
# to turn a hung runner into a red mark that can be re-run in a minute.
#
# Deliberately per job rather than one number: the jobs differ by an order
# of magnitude, and a single value generous enough for the build matrix
# would let the four-second acknowledgments job hang all morning.
jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # BUILD_REF, not the default: on pull_request the default
          # checkout is GitHub's synthetic merge commit, which carries no
          # Signed-off-by, so the DCO check would never see the
          # contributor's own commits.
          ref: ${{ env.BUILD_REF }}
      # clang-format is pinned so CI and a contributor's machine reach the
      # same verdict; the wheel is the one install that works identically
      # on all three desktop platforms, which is what CONTRIBUTING.md
      # tells people to use. shellcheck comes with the runner image.
      #
      # setup-python rather than the system one: Ubuntu's is marked
      # externally-managed (PEP 668) and refuses a plain pip install.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: clang-format (pinned by .llvm-version)
        run: pip install "clang-format==$(cat .llvm-version)"
      # Pillow is the stills tool's one dependency, and it is pinned for
      # the same reason the clang tools are: a gate whose version floats
      # is a gate that can start disagreeing with the machine a person
      # ran it on.
      - name: Pillow (pinned by .pillow-version)
        run: pip install "pillow==$(cat .pillow-version)"
      # Before the gates themselves, because a gate that cannot fail is
      # worse than no gate: this asserts each one rejects what it exists
      # to reject.
      - name: guard self-test (negative cases)
        run: bash scripts/test-guards.sh
      # And the session runner's own, for the same reason: its third
      # outcome — skipped, because this disk is not that disk — has to be
      # impossible to read as a pass, and that is a property of an output
      # nobody would otherwise assert (#101).
      - name: session-runner self-test (the skip that is not a pass)
        run: bash scripts/test-sweep.sh
      # And the release bundler's, for the third time for the same reason.
      # What it stages is what another repository pins by sha256 and
      # refuses to build without (#200), so its refusals — a build tree
      # that has drifted from the asset list, a `sourceCommit` that is an
      # annotated tag object rather than a commit — have to be refusals
      # here rather than on the one push a year that publishes a tag.
      - name: release-bundler self-test (the refusals)
        run: bash scripts/test-release-bundle.sh
      # And the stills tool's, for the fourth time for the same reason.
      # Every visual claim the journal test plan makes is a number this
      # tool printed — a pixel count, a box, a digest — and the two with
      # a convention in them would drift silently: a rect is inclusive on
      # both sides, unlike PIL's own boxes, and "confined" is an exit
      # status and not only a line of text (#233).
      - name: stills-tool self-test (the rect convention, and confinement)
        run: bash scripts/test-frames.sh
      # And the visual runner's, for the fifth. It has the sweep's three
      # outcomes and the sweep's rule about the third — a run that
      # checked nothing must never read as a pass — and CI is a machine
      # with no disk, so every leg here skips and the whole point is that
      # skipping is loud. It also parses every committed leg, so a typo
      # in one is caught here rather than on the one machine that can run
      # it (#234).
      - name: visual-leg self-test (the skip that is not a pass)
        run: bash scripts/test-visual-legs.sh
      - name: content guard (every commit + index + working tree)
        run: bash scripts/check-clean.sh
      - name: DCO check (every non-merge commit)
        run: bash scripts/check-dco.sh
      - name: host-time guard (no clock reads under core/)
        run: bash scripts/check-host-time.sh
      - name: format check (clang-format over tracked C++)
        run: bash scripts/check-format.sh
      - name: shell lint (shellcheck over scripts/)
        run: bash scripts/check-shell.sh

  # Separate from the guards job because it is the only gate that needs a
  # configured build tree — clang-tidy reads the compile database and the
  # generated headers. Configure only: `cmake --preset` fetches the
  # dependencies and runs configure_file, which is everything tidy needs,
  # so this job never compiles a translation unit.
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - name: SDL3 backend headers
        # apt on these runners stalls mid-fetch and never comes back.
        # Two guesses at the cause have now been wrong: it is not a
        # debconf prompt (every hang was in `update`, before a package is
        # unpacked), and `Acquire::*::Timeout` does not catch it either —
        # the run after that fix went in stalled for ten minutes on this
        # very step, and the two after that died at the job timeout.
        #
        # So the timeout is imposed from outside, where apt cannot
        # decline it. `timeout` sends SIGTERM to the whole thing at two
        # minutes, which is roughly twice a healthy run of both commands
        # together, and the loop tries again. That turns an afternoon
        # into at worst six minutes and, in every stall observed so far,
        # into a second attempt that simply works.
        #
        # The Acquire options stay: they cost nothing and they are right
        # for the ordinary case of one slow mirror among several.
        # DEBIAN_FRONTEND stays for the same reason — an unattended
        # install should set it, whether or not it was ever the cause.
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_TIMEOUTS: >-
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
        run: |
          # $APT_TIMEOUTS is unquoted on purpose: it is a list of flags
          # and has to word-split. (scripts/check-shell.sh does not read
          # workflow files, so there is no linter to appease here — the
          # note is for whoever edits this next.)
          # The runner's primary mirror is dead: every
          # azure.archive.ubuntu.com line in a failing log comes back
          # `Ign:`, apt falls back to the public archive, and the fetch
          # of the package indices through that fallback is what stalls.
          #
          # The mirror is not configured in sources.list. These images use
          # `mirror+file:/etc/apt/apt-mirrors.txt`, a preference-ordered
          # list with Azure first and the public archive behind it — which
          # is why an earlier version of this step rewrote the sources
          # files and changed precisely nothing, azure lines and all. Drop
          # the dead host from the list apt actually reads, leaving the
          # one that answers, so there is no fallback left to stall in.
          # The sources rewrite stays for images that do point there
          # directly.
          sudo sed -i '/azure.archive.ubuntu.com/d' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo "apt mirrors in use:"
          cat /etc/apt/apt-mirrors.txt 2>/dev/null || echo "  (no apt-mirrors.txt)"

          # $1 is the timeout in seconds; the rest is apt's own argv.
          # `update` and `install` get very different budgets: fetching
          # index files is quick and is where the stalls happen, while
          # unpacking two dozen -dev packages legitimately takes minutes.
          # An earlier version of this used one 120s budget for both and
          # killed `install` mid-unpack, which left dpkg interrupted and
          # made every retry fail on that rather than on the network —
          # hence the repair below, which is a no-op when nothing broke.
          apt_try() {
            budget=$1
            shift
            for attempt in 1 2 3 4 5; do
              if sudo timeout "$budget" apt-get $APT_TIMEOUTS "$@"; then
                return 0
              fi
              echo "::warning::apt-get $1 stalled (attempt $attempt/5)"
              sudo pkill -9 -x apt-get || true
              sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock
              sudo dpkg --configure -a || true
              sleep 5
            done
            return 1
          }
          apt_try 180 update
          apt_try 600 install -y --no-install-recommends \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libjack-jackd2-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl-dev libegl-dev libgles-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev liburing-dev
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: clang-tidy (pinned by .llvm-version)
        run: pip install "clang-tidy==$(cat .llvm-version)"
      - name: Cache the SDL3 clone
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-clang/_deps/sdl3-src
            build/linux-clang/_deps/sdl3-subbuild
          key: sdl3-tidy-${{ hashFiles('cmake/AmberfolioSDL3.cmake') }}
      - name: Cache the GoogleTest clone
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-clang/_deps/googletest-src
            build/linux-clang/_deps/googletest-subbuild
          key: gtest-tidy-${{ hashFiles('cmake/AmberfolioGoogleTest.cmake') }}
      - name: Cache the conformance dependency clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-clang/_deps/simdjson-src
            build/linux-clang/_deps/simdjson-subbuild
            build/linux-clang/_deps/libdeflate-src
            build/linux-clang/_deps/libdeflate-subbuild
          key: conformance-deps-tidy-${{ hashFiles('cmake/AmberfolioConformance.cmake') }}
      - name: configure (for the compile database)
        run: cmake --preset linux-clang
      - name: clang-tidy
        run: bash scripts/check-tidy.sh build/linux-clang

  # The CPU conformance oracle (issue #14). SingleStepTests/8088 is
  # 726 MB at the pinned commit; the fetch script takes it in one sparse
  # partial clone and condenses it to about 300 MB on the way in, and
  # that is what gets cached — keyed on the suite commit and the
  # condenser version together, so changing either is a new cache rather
  # than a stale one silently reused.
  #
  # Once per operating system, not once per job: an Actions cache cannot
  # be restored on an OS other than the one that saved it, so a single
  # Linux job cannot supply the Windows and macOS builds however much one
  # would like it to. Three legs here is still far better than the six
  # jobs that would otherwise each fetch and condense for themselves.
  #
  # Every job that runs vectors depends on this one, which costs them the
  # half-minute a cache hit takes.
  vectors:
    name: conformance vectors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Git Bash on the Windows leg, so these steps are one script
        # rather than one per shell.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      # For the fetch script, and so that `python` means the same thing
      # on all three runners.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # The script is the single source of truth for the suite pin and
      # the condensed layout. The workflow repeats its cache key at the
      # top of this file because every job needs it; this is what stops
      # the copy from drifting away from the original.
      - name: The cache key still matches the pin
        run: |
          want="conformance-$(python scripts/fetch-conformance-vectors.py --print-key)"
          if [ "$want" != "$CONFORMANCE_CACHE_KEY" ]; then
            echo "the workflow's CONFORMANCE_CACHE_KEY is $CONFORMANCE_CACHE_KEY,"
            echo "but scripts/fetch-conformance-vectors.py says $want."
            echo "Update the env: block at the top of this file."
            exit 1
          fi
          echo "cache key: $CONFORMANCE_CACHE_KEY"
      - name: Where the vectors go
        run: |
          echo "AMBERFOLIO_CONFORMANCE_VECTORS=$RUNNER_TEMP/conformance-vectors" \
            >> "$GITHUB_ENV"
      # lookup-only: this job only has to know whether the cache exists.
      # Downloading 300 MB to find that out, on every push, would be most
      # of its wall time on the path that has nothing to do.
      - name: Is the condensed set already cached?
        id: probe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance-vectors
          key: ${{ env.CONFORMANCE_CACHE_KEY }}
          lookup-only: true
      - name: Fetch and condense
        if: steps.probe.outputs.cache-hit != 'true'
        run: python scripts/fetch-conformance-vectors.py
      - name: Cache the condensed set
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance-vectors
          key: ${{ env.CONFORMANCE_CACHE_KEY }}

  # M1's exit criterion (PLAN.md §7), and now the thing that keeps it
  # true: the whole suite, every vector of all 323 files, on every push. Its own job rather than a
  # row in the build matrix because it is the one run with nothing capped,
  # and because a conformance failure deserves to read as itself rather
  # than as "linux is broken".
  #
  # No SDL host here: this job builds the core and the test binaries and
  # nothing else, which saves it the whole backend-header apparatus the
  # matrix job needs.
  conformance:
    name: conformance (full suite)
    needs: [vectors]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: conformance
          max-size: 300M
      - name: Cache the GoogleTest clone
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-gcc/_deps/googletest-src
            build/linux-gcc/_deps/googletest-subbuild
          key: gtest-conformance-${{ hashFiles('cmake/AmberfolioGoogleTest.cmake') }}
      - name: Cache the conformance dependency clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-gcc/_deps/simdjson-src
            build/linux-gcc/_deps/simdjson-subbuild
            build/linux-gcc/_deps/libdeflate-src
            build/linux-gcc/_deps/libdeflate-subbuild
          key: conformance-deps-${{ hashFiles('cmake/AmberfolioConformance.cmake') }}
      - name: Where the vectors are
        run: |
          echo "AMBERFOLIO_CONFORMANCE_VECTORS=$RUNNER_TEMP/conformance-vectors" \
            >> "$GITHUB_ENV"
      # fail-on-cache-miss: without the vectors the suite reports every
      # file as skipped and exits 0, which is precisely the silent pass
      # this job exists to prevent. (AMBERFOLIO_CONFORMANCE_REQUIRED below
      # is the same argument one level down, for a cache that restored
      # something incomplete.)
      - name: Restore the condensed vectors
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance-vectors
          key: ${{ env.CONFORMANCE_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: configure
        run: cmake --preset linux-gcc -DAMBERFOLIO_BUILD_HOST_SDL=OFF
      - name: build
        run: cmake --build --preset linux-gcc
      - name: conformance suite
        env:
          AMBERFOLIO_CONFORMANCE_REQUIRED: '1'
        run: ctest --preset linux-gcc -L conformance
  # Every target, every push. The jobs deliberately run the same three
  # commands a contributor runs locally — cmake --preset / --build --preset
  # / ctest --preset — so a green matrix means the documented workflow
  # works, not just some CI-only incantation.
  build:
    name: build (${{ matrix.name }})
    # For the conformance vectors: the native rows run a capped subset of
    # the suite, so a family that only breaks under a different compiler
    # is caught here rather than by the linux-gcc job alone. The wasm row
    # needs nothing from it and waits anyway, which is the price of a
    # job-level dependency.
    needs: [vectors]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One broken target should not hide the state of the other four.
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            preset: windows-msvc
          # No ccache here: the universal preset compiles with two -arch
          # flags, which ccache does not cache — it would fall through to
          # the compiler on every file for the cost of a cache step.
          - name: macos-universal
            os: macos-latest
            preset: macos
          - name: linux-gcc
            os: ubuntu-latest
            preset: linux-gcc
            launcher: ccache
          - name: linux-clang
            os: ubuntu-latest
            preset: linux-clang
            launcher: ccache
          - name: wasm
            os: ubuntu-latest
            preset: wasm
            emscripten: true
    env:
      # CMake seeds CMAKE_<LANG>_COMPILER_LAUNCHER from the environment, so
      # ccache attaches itself without CI having to pass flags the presets
      # do not carry. Empty on the jobs that leave it out of the matrix.
      CMAKE_C_COMPILER_LAUNCHER: ${{ matrix.launcher }}
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.launcher }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Same reasoning as the guards job: build the contributor's head
          # commit and not GitHub's synthetic merge commit, and a tag's
          # commit and not the tag object. See BUILD_REF at the top.
          ref: ${{ env.BUILD_REF }}

      # CMake, Ninja and node come with every runner image; only the SDL3
      # backend headers and the compilers have to be arranged for.
      #
      # SDL3's own README-linux dependency list, which is not optional. A
      # partly-installed backend is a hard configure error (SDL's
      # SDL_missing_dependency is FATAL_ERROR on Linux); a wholly absent one
      # is dropped without a word, which is the worse case — it builds green
      # on a host that cannot open a window. Install the lot: the desktop
      # host has to carry every backend a Linux player might need, or the
      # green light here means nothing.
      - name: SDL3 backend headers (X11, Wayland, audio, KMS, udev, D-Bus)
        if: runner.os == 'Linux' && !matrix.emscripten
        # See the tidy job's copy of this step for why apt is run under
        # an external timeout.
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_TIMEOUTS: >-
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
        run: |
          # $APT_TIMEOUTS is unquoted on purpose: it is a list of flags
          # and has to word-split. (scripts/check-shell.sh does not read
          # workflow files, so there is no linter to appease here — the
          # note is for whoever edits this next.)
          # The runner's primary mirror is dead: every
          # azure.archive.ubuntu.com line in a failing log comes back
          # `Ign:`, apt falls back to the public archive, and the fetch
          # of the package indices through that fallback is what stalls.
          #
          # The mirror is not configured in sources.list. These images use
          # `mirror+file:/etc/apt/apt-mirrors.txt`, a preference-ordered
          # list with Azure first and the public archive behind it — which
          # is why an earlier version of this step rewrote the sources
          # files and changed precisely nothing, azure lines and all. Drop
          # the dead host from the list apt actually reads, leaving the
          # one that answers, so there is no fallback left to stall in.
          # The sources rewrite stays for images that do point there
          # directly.
          sudo sed -i '/azure.archive.ubuntu.com/d' \
            /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo "apt mirrors in use:"
          cat /etc/apt/apt-mirrors.txt 2>/dev/null || echo "  (no apt-mirrors.txt)"

          # $1 is the timeout in seconds; the rest is apt's own argv.
          # `update` and `install` get very different budgets: fetching
          # index files is quick and is where the stalls happen, while
          # unpacking two dozen -dev packages legitimately takes minutes.
          # An earlier version of this used one 120s budget for both and
          # killed `install` mid-unpack, which left dpkg interrupted and
          # made every retry fail on that rather than on the network —
          # hence the repair below, which is a no-op when nothing broke.
          apt_try() {
            budget=$1
            shift
            for attempt in 1 2 3 4 5; do
              if sudo timeout "$budget" apt-get $APT_TIMEOUTS "$@"; then
                return 0
              fi
              echo "::warning::apt-get $1 stalled (attempt $attempt/5)"
              sudo pkill -9 -x apt-get || true
              sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock
              sudo dpkg --configure -a || true
              sleep 5
            done
            return 1
          }
          apt_try 180 update
          apt_try 600 install -y --no-install-recommends \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libjack-jackd2-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl-dev libegl-dev libgles-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev liburing-dev
      - name: MSVC developer environment (cl on PATH)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # The emsdk pin has one home, .emscripten-version, which README.md
      # tells contributors to install locally — CI must not drift from it.
      - name: Read the Emscripten pin
        id: emsdk-pin
        if: matrix.emscripten
        run: echo "version=$(cat .emscripten-version)" >> "$GITHUB_OUTPUT"
      - name: Emscripten ${{ steps.emsdk-pin.outputs.version }}
        if: matrix.emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ steps.emsdk-pin.outputs.version }}
          # The toolchain is a few hundred MB; caching it is most of this
          # job's wall time.
          actions-cache-folder: emsdk-${{ steps.emsdk-pin.outputs.version }}

      - name: ccache
        if: matrix.launcher == 'ccache'
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ matrix.name }}
          # Enough for SDL3 plus our own objects, which is what dominates a
          # cold build here.
          max-size: 500M

      # SDL3 is fetched at configure time (cmake/AmberfolioSDL3.cmake), and
      # a shallow clone of it on every push is pure waste. Only the source
      # and FetchContent's own bookkeeping are cached; the objects it
      # builds from that source are ccache's job.
      - name: Cache the SDL3 clone
        if: '!matrix.emscripten'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps/sdl3-src
            build/${{ matrix.preset }}/_deps/sdl3-subbuild
          key: sdl3-${{ matrix.name }}-${{ hashFiles('cmake/AmberfolioSDL3.cmake') }}

      # Same deal for GoogleTest (cmake/AmberfolioGoogleTest.cmake). Kept a
      # separate entry from SDL3's so bumping one pin does not re-clone the
      # other. The wasm job does not build the tests, so it needs neither.
      - name: Cache the GoogleTest clone
        if: '!matrix.emscripten'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps/googletest-src
            build/${{ matrix.preset }}/_deps/googletest-subbuild
          key: gtest-${{ matrix.name }}-${{ hashFiles('cmake/AmberfolioGoogleTest.cmake') }}

      # The conformance harness's two libraries (issue #14). One entry for
      # both: they are pinned in one file, so one hash decides both.
      - name: Cache the conformance dependency clones
        if: '!matrix.emscripten'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps/simdjson-src
            build/${{ matrix.preset }}/_deps/simdjson-subbuild
            build/${{ matrix.preset }}/_deps/libdeflate-src
            build/${{ matrix.preset }}/_deps/libdeflate-subbuild
          key: conformance-deps-${{ matrix.name }}-${{ hashFiles('cmake/AmberfolioConformance.cmake') }}

      # A capped subset on the native targets: enough to catch a family
      # that behaves differently under another compiler, far short of the
      # eight minutes the full set would cost four more times. The
      # uncapped run is the `conformance` job. wasm builds no tests at all
      # (PLAN.md §6 — the conformance suite runs on native CI), so it
      # takes neither the vectors nor the cap.
      - name: Where the vectors are
        if: '!matrix.emscripten'
        shell: bash
        run: |
          echo "AMBERFOLIO_CONFORMANCE_VECTORS=$RUNNER_TEMP/conformance-vectors" \
            >> "$GITHUB_ENV"
      - name: Restore the condensed vectors
        if: '!matrix.emscripten'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance-vectors
          key: ${{ env.CONFORMANCE_CACHE_KEY }}
          fail-on-cache-miss: true

      # AMBERFOLIO_SOURCE_URL is the AGPL-3.0-only §13 source offer the web
      # page carries, pinned to the commit this build came from rather
      # than to a branch that will have moved on by the time anyone
      # follows it. Passed to every preset from this one shared step; only
      # the web host reads it (see the top-level CMakeLists).
      #
      # The sha comes out of the checkout rather than out of an expression:
      # HEAD is what was built, whatever kind of ref pointed at it, and on
      # a tag push an expression would have pinned the offer to the tag
      # object (see BUILD_REF at the top of this file). The release job
      # resolves the same commit the same way, which is what makes a
      # release's `sourceCommit` and the page's own link the same string.
      - name: The commit this build came from
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: configure
        run: >
          cmake --preset ${{ matrix.preset }}
          "-DAMBERFOLIO_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}/tree/${{ steps.commit.outputs.sha }}"
      - name: build
        run: cmake --build --preset ${{ matrix.preset }}
      # On the native targets this is the GoogleTest suite (one CTest case
      # per test) plus the SDL host smoke check; on wasm it is the module
      # smoke check, which loads the module under node and asks it for its
      # version. Both also run the self-written 8086 programs
      # (tests/programs), which is the only thing that runs the
      # interpreter on the wasm target rather than only building it. A
      # failing test fails the job — the presets set outputOnFailure, so
      # the assertion lands in the log.
      #
      # `--parallel 4` overrides the presets' own width, which is "every
      # processor there is" (CMakePresets.json). That width is meant for
      # a developer's machine; a runner is not one. The first parallel run
      # of this suite lost 295 cases on macos-latest inside a two-second
      # window, every one of them to `posix_spawn` answering "resource
      # temporarily unavailable" — trivial cases like `Version.*` among
      # them, so the machine had briefly stopped being able to spawn
      # anything at all rather than having run out of memory for ours.
      # That runner's CMake also launches every discovered case through a
      # `LaunchTest.cmake` wrapper, doubling the spawn rate, which is the
      # part of it under our control only by asking for less.
      #
      # Four is well under the threshold, still four times the serial run
      # this replaced, and uniform across the matrix so no platform is a
      # special case waiting to surprise somebody.
      - name: test
        env:
          AMBERFOLIO_CONFORMANCE_LIMIT: '500'
          AMBERFOLIO_CONFORMANCE_REQUIRED: ${{ matrix.emscripten && '' || '1' }}
        run: ctest --preset ${{ matrix.preset }} --parallel 4

      # The optimised module, and the one that ships (#116, M4-W1 #108).
      # Debug was what the deployed page ran until now, and it costs about
      # nine times the wall clock and thirty-three times the bytes — 5.7 MB
      # of wasm against 172 KB, and roughly ten times real time against
      # ninety. Ten times is still enough for a browser at 1x, which is why
      # nothing looked wrong; it is also nine-tenths of the margin that has
      # to absorb a slow phone, a busy tab and a speed preset above 1x
      # (PLAN.md §4).
      #
      # **Both configurations are built and both are tested**, rather than
      # one swapped for the other. Debug stays because it is the leg that
      # catches a whole class of bug the optimiser hides: #84's
      # `framebuffer::reset()` overflowed Emscripten's stack in Debug only.
      # A green Release and a red Debug is a finding, not a formality.
      - name: build (optimised)
        if: matrix.emscripten
        run: cmake --build --preset wasm-release
      - name: test (optimised)
        if: matrix.emscripten
        run: ctest --preset wasm-release

      # The browser's OCR engine, beside the page it is served from
      # (M5-E3e). Without this the deployed site has no
      # `vendor/tesseract/` at all, and a player who picks their journal
      # gets every entry located, every rectangle cropped, and "there is
      # no OCR engine to read it with" - which is what shipped from #174
      # until now.
      #
      # It is fetched here rather than committed because it is 32 MB of
      # third-party binaries (`scripts/fetch-ocr-engine.py` has the
      # argument), and verified against `scripts/ocr-engine.sha256sums`
      # because a deploy that starts serving different bytes should be a
      # commit and not a Tuesday - the same sentence the pinned Vercel
      # CLI below is there for.
      #
      # A visitor pays nothing for it. `loadEngine()` is called when a
      # journal is ingested, not when the page loads, so the cost lands
      # only on somebody who picks a PDF.
      - name: Fetch the browser's OCR engine
        if: matrix.emscripten
        run: python scripts/fetch-ocr-engine.py --into build/wasm/hosts/web/Release

      # What the deploy job ships (deploy/vercel/README.md). Uploaded on
      # every event rather than only on main, because a pull request from
      # this repository gets a preview deployment of exactly the bytes CI
      # just tested. smoke.mjs stays behind: it is the node check's
      # apparatus, and the deployed site is the page.
      - name: Upload the web host
        if: matrix.emscripten
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-host
          path: |
            build/wasm/hosts/web/Release
            !build/wasm/hosts/web/Release/smoke.mjs
          if-no-files-found: error
          retention-days: 7

  # ASan + UBSan over the test suite (PLAN.md §6). Its own job rather than
  # another row in the matrix above: it builds no host, so it needs none of
  # that job's SDL3 apparatus, and a sanitizer finding deserves to read as
  # its own signal rather than as "linux is broken".
  sanitizers:
    name: sanitizers (ASan + UBSan)
    needs: [vectors]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: linux-asan-ubsan
          # Smaller than the matrix jobs': no SDL3 in this build tree, so
          # it is our objects plus GoogleTest's.
          max-size: 200M
      - name: Cache the GoogleTest clone
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-asan-ubsan/_deps/googletest-src
            build/linux-asan-ubsan/_deps/googletest-subbuild
          key: gtest-asan-${{ hashFiles('cmake/AmberfolioGoogleTest.cmake') }}
      - name: Cache the conformance dependency clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-asan-ubsan/_deps/simdjson-src
            build/linux-asan-ubsan/_deps/simdjson-subbuild
            build/linux-asan-ubsan/_deps/libdeflate-src
            build/linux-asan-ubsan/_deps/libdeflate-subbuild
          key: conformance-deps-asan-${{ hashFiles('cmake/AmberfolioConformance.cmake') }}
      - name: Where the vectors are
        run: |
          echo "AMBERFOLIO_CONFORMANCE_VECTORS=$RUNNER_TEMP/conformance-vectors" \
            >> "$GITHUB_ENV"
      - name: Restore the condensed vectors
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance-vectors
          key: ${{ env.CONFORMANCE_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: configure
        run: cmake --preset linux-asan-ubsan
      - name: build
        run: cmake --build --preset linux-asan-ubsan
      # ASAN_OPTIONS and UBSAN_OPTIONS live in the test preset rather than
      # here, so a contributor running `ctest --preset linux-asan-ubsan`
      # gets the run CI got — including -fno-sanitize-recover, which is
      # what stops a real finding from printing and exiting 0.
      #
      # A hundred vectors per file rather than five hundred: instrumented
      # code is an order of magnitude slower, and what this job is looking
      # for — a bad index, an uninitialised read — shows up in the first
      # hundred or not at all.
      - name: test
        env:
          AMBERFOLIO_CONFORMANCE_LIMIT: '100'
          AMBERFOLIO_CONFORMANCE_REQUIRED: '1'
        run: ctest --preset linux-asan-ubsan

  # Publish the wasm host. Built in Actions and deployed prebuilt: the
  # matrix job above already has the pinned emsdk and its cache, and
  # pinning the toolchain a second time in Vercel's settings would be a
  # second source of truth waiting to drift. deploy/vercel/README.md has
  # the reasoning and the one-time project setup.
  deploy:
    name: deploy (wasm host)
    # Nothing ships past a red gate — including a red sanitizer run, a red
    # conformance run, and a target other than wasm: a module published
    # while linux is broken is not a state worth putting a public URL on.
    needs: [guards, tidy, build, sanitizers, conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two pushes in quick succession should leave the later one live
    # rather than race for it.
    concurrency:
      group: deploy-${{ github.event.pull_request.head.ref || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      # Production for main, a preview for a pull request from this
      # repository, nothing otherwise. Two cases deliberately pass rather
      # than fail: a fork's pull request, which must never reach the
      # secrets, and a repository that has not been given them yet. Both
      # decide it here rather than in the job's `if:` so the reason lands
      # in the log — a skipped job explains nothing to the person reading
      # it. (`secrets` is not available to a job-level `if` anyway.)
      - name: What does this run deploy?
        id: target
        env:
          # A boolean, not the secret: this only asks whether the
          # repository has been given one.
          HAVE_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          # Not merely "is this a pull request" — a fork's head repository
          # is a different one, and that is the case that must never see a
          # secret. One line because a folded YAML scalar would leave a
          # newline inside the expression.
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          target=none
          if [ "$IS_FORK_PR" = true ]; then
            reason="pull request from a fork — the deployment secrets are not exposed to it"
          elif [ "$HAVE_TOKEN" != true ]; then
            reason="VERCEL_TOKEN is not set on this repository (see deploy/vercel/README.md)"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            target=production
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            target=preview
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            reason="a tag run publishes a Release, not a deployment (see the release job)"
          else
            reason="only main is published; a pull request from this repository gets a preview"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [ "$target" = none ]; then
            echo "not deploying: $reason"
            echo "Not deploying: $reason." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploying: $target"
          fi

      - name: Download the web host the wasm job built
        if: steps.target.outputs.target != 'none'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-host
          path: .vercel/output/static

      # The header and routing policy, in the form a prebuilt deployment
      # reads it — Vercel's build, and with it any vercel.json, is exactly
      # what this pipeline skips. The listing is the audit trail: what
      # ships is the wasm build tree and nothing else, and it is worth
      # being able to see that on any given deployment.
      - name: Stage the deployment
        if: steps.target.outputs.target != 'none'
        run: |
          cp deploy/vercel/config.json .vercel/output/config.json
          cd .vercel/output/static
          echo 'files to be deployed:'
          find . -type f | sort
          {
            echo '### Deployment contents'
            echo
            echo '```'
            find . -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Pinned like every other toolchain here: a deploy that starts
      # behaving differently should be a commit, not a Tuesday.
      - name: Vercel CLI
        if: steps.target.outputs.target != 'none'
        run: npm install --global vercel@59.1.3

      - name: Deploy
        if: steps.target.outputs.target != 'none'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          # --prebuilt: ship .vercel/output as it stands, build nothing.
          # The "did you mean the subdirectory deploy/?" warning this
          # prints is this repository's own deploy/ directory being
          # noticed, not a mistake; the subcommand still wins.
          args=(deploy --prebuilt --yes --token "$VERCEL_TOKEN")
          if [ "$TARGET" = production ]; then
            args+=(--prod)
          fi
          # Progress goes to stderr and the deployment URL to stdout —
          # but not always alone: the CLI switches to a JSON summary when
          # it decides its caller is a machine. Rather than bet on which
          # form CI gets, take the first deployment host out of whatever
          # arrives, and never let a parse miss fail a deploy that
          # already happened.
          out=$(vercel "${args[@]}")
          printf '%s\n' "$out"
          url=$(printf '%s\n' "$out" \
            | grep -Eom1 'https://[a-z0-9.-]+\.vercel\.app' || true)
          {
            echo "### Deployed — $TARGET"
            echo
            if [ -n "$url" ]; then
              echo "$url"
            else
              echo 'Deployed, but the CLI output held no URL to quote:'
              echo
              echo '```'
              printf '%s\n' "$out"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Publish a tag: the web host's build output, attached to a GitHub
  # Release with its hashes (#200).
  #
  # The site that hosts the wasm build consumes a release as a pinned
  # build input — a tag and a sha256 per asset in a lockfile, and a build
  # that refuses to start when the bytes do not match. Before this, the
  # only thing to pin was the dev page above, which is redeployed on every
  # push to main and served `no-store`: every landing here was a red build
  # downstream and a lockfile bump nobody asked for. A tag is the fix
  # because a tag is deliberate, rare, and never moved (CONTRIBUTING.md).
  #
  # The bytes are the artifact the wasm matrix row uploaded rather than a
  # rebuild — so the release is literally the bytes this run tested, and
  # the deployed page and the release can never disagree about what a
  # commit builds to. Everything about the shape of the bundle lives in
  # scripts/release-bundle.sh, where it is tested; this job downloads,
  # calls it, and hands the result to `gh`.
  #
  # This is the *forward* path, and it is the one that can hold the full
  # gate, because the workflow and the tree it is gating are the same
  # commit. release.yml is the other one, for a tag older than this job.
  release:
    name: release (${{ github.ref_name }})
    # A `v*` tag push. Spelled out rather than taken from BUILD_REF
    # because a job-level `if:` has no `env` context.
    if: startsWith(github.ref, 'refs/tags/v')
    # The same gate the deploy job uses, for the same reason: nothing ships
    # past a red guard, tidy, build, sanitizer or conformance run. A
    # release is the more permanent of the two — a deployment is replaced
    # by the next push; a published sha256 is pinned somewhere else by
    # morning.
    needs: [guards, tidy, build, sanitizers, conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job in this workflow that writes anything back, and the
    # narrowest grant that lets it. Everything else runs on the default
    # token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
          # The tag *object*, for two things: peeling it to the commit, and
          # its message. CONTRIBUTING.md asks a tag for one paragraph on
          # what the milestone means and what it does not; that paragraph
          # is the release notes, so a milestone has one description rather
          # than two that can disagree.
          fetch-depth: 0
          fetch-tags: true

      - name: The tag, and the commit it names
        id: what
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH tag"
              exit 1
              ;;
          esac
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          head=$(git rev-parse HEAD)
          # BUILD_REF is what every job in this run checked out, so this
          # equality is the whole reason the released manifest may claim
          # these bytes came from this commit. If it ever fails, the matrix
          # built one tree and the release is describing another.
          if [ "$commit" != "$head" ]; then
            echo "::error::$TAG names $commit but this run built $head"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Download the web host the wasm job built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-host
          path: web-host

      - name: Stage the release
        env:
          TAG: ${{ steps.what.outputs.tag }}
          COMMIT: ${{ steps.what.outputs.commit }}
        run: |
          bash scripts/release-bundle.sh \
            web-host "$RUNNER_TEMP/release" "$TAG" "$COMMIT"

      # The tag's own message on top, then what a consumer needs: the
      # commit, which is the link that discharges AGPL-3.0-only §13 for
      # anyone serving these bytes over a network, and the hashes in the
      # form a person checks by hand.
      - name: Release notes
        env:
          TAG: ${{ steps.what.outputs.tag }}
          COMMIT: ${{ steps.what.outputs.commit }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/tree/${{ steps.what.outputs.commit }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bt='`'
          {
            # Subject and body rather than %(contents), which on a signed
            # tag would paste the PGP block into the notes as well.
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG"
            echo
            echo '---'
            echo
            echo 'The web host of this project, for a page that wants to run the'
            echo 'emulator without containing it. `manifest.json` states the sha256'
            echo 'and the size of each of the six bundle files, and the commit they'
            echo 'were built from; `SHA256SUMS` covers every asset here, notices'
            echo 'included.'
            echo
            # The backtick comes from a variable because inside double
            # quotes a pair of them is command substitution, and the sha
            # would have been run as a command.
            echo "- Source: [${bt}${COMMIT}${bt}]($SOURCE)"
            echo "- Built by: [this run]($RUN)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/release/SHA256SUMS"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      # `gh` rather than a release action: it is on the runner already, so
      # there is one less third-party action in the supply chain of the one
      # job here that can write to the repository — and pinning that action
      # by sha, which is what this workflow does with everything else,
      # would have been pinning a wrapper around this same command.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.what.outputs.tag }}
        run: |
          # Never over an existing one. The assets are not bit-reproducible
          # — a different emsdk build of the same source is a different wasm
          # — so replacing them would change hashes somebody has already
          # pinned, under a tag they were told never moves. A release that
          # has to be redone is deleted by hand first, on purpose, by
          # someone who has checked who is pinning it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists; delete it" \
              "deliberately (gh release delete $TAG) before re-publishing," \
              "and expect every consumer pinning its hashes to notice"
            exit 1
          fi
          # **Every pre-1.0 tag is a pre-release**, by PLAN.md §7: the
          # milestone tags exist so that there is always a current,
          # runnable one while the work converges on 1.0, and none of them
          # is that release. The rule is here rather than in a person's
          # habit because it has a consequence worth being deliberate
          # about — `/releases/latest` *excludes* pre-releases, so a
          # consumer that tracks "latest" rather than a tag sees nothing
          # at all until 1.0. That is the right answer for now (there is
          # no release anyone should be tracking blind) and it flips on
          # its own at 1.0, when this case stops matching.
          extra=()
          case "$TAG" in
            v0.*) extra+=(--prerelease) ;;
          esac
          # --verify-tag: make a release for a tag that exists, never a tag
          # as a side effect of releasing.
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${extra[@]}" \
            "$RUNNER_TEMP/release"/*
