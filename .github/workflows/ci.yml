# SPDX-License-Identifier: AGPL-3.0-only
name: ci
on:
  push:
  pull_request:
    # "edited" is not a default activity type, but the acknowledgments
    # job reads the PR body, which the author may fix after opening.
    types: [opened, synchronize, reopened, edited]
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On pull_request the default checkout is GitHub's synthetic
          # merge commit, which carries no Signed-off-by; guard the PR
          # head instead so the DCO check sees the contributor's commits.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # clang-format is pinned so CI and a contributor's machine reach the
      # same verdict; the wheel is the one install that works identically
      # on all three desktop platforms, which is what CONTRIBUTING.md
      # tells people to use. shellcheck comes with the runner image.
      #
      # setup-python rather than the system one: Ubuntu's is marked
      # externally-managed (PEP 668) and refuses a plain pip install.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: clang-format (pinned by .llvm-version)
        run: pip install "clang-format==$(cat .llvm-version)"
      # Before the gates themselves, because a gate that cannot fail is
      # worse than no gate: this asserts each one rejects what it exists
      # to reject.
      - name: guard self-test (negative cases)
        run: bash scripts/test-guards.sh
      - name: content guard (every commit + index + working tree)
        run: bash scripts/check-clean.sh
      - name: DCO check (every non-merge commit)
        run: bash scripts/check-dco.sh
      - name: format check (clang-format over tracked C++)
        run: bash scripts/check-format.sh
      - name: shell lint (shellcheck over scripts/)
        run: bash scripts/check-shell.sh

  # Separate from the guards job because it is the only gate that needs a
  # configured build tree — clang-tidy reads the compile database and the
  # generated headers. Configure only: `cmake --preset` fetches the
  # dependencies and runs configure_file, which is everything tidy needs,
  # so this job never compiles a translation unit.
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: SDL3 backend headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libjack-jackd2-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl-dev libegl-dev libgles-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev liburing-dev
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: clang-tidy (pinned by .llvm-version)
        run: pip install "clang-tidy==$(cat .llvm-version)"
      - name: Cache the SDL3 clone
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-clang/_deps/sdl3-src
            build/linux-clang/_deps/sdl3-subbuild
          key: sdl3-tidy-${{ hashFiles('cmake/AmberfolioSDL3.cmake') }}
      - name: Cache the GoogleTest clone
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-clang/_deps/googletest-src
            build/linux-clang/_deps/googletest-subbuild
          key: gtest-tidy-${{ hashFiles('cmake/AmberfolioGoogleTest.cmake') }}
      - name: configure (for the compile database)
        run: cmake --preset linux-clang
      - name: clang-tidy
        run: bash scripts/check-tidy.sh build/linux-clang
  # Every target, every push. The jobs deliberately run the same three
  # commands a contributor runs locally — cmake --preset / --build --preset
  # / ctest --preset — so a green matrix means the documented workflow
  # works, not just some CI-only incantation.
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken target should not hide the state of the other four.
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            preset: windows-msvc
          # No ccache here: the universal preset compiles with two -arch
          # flags, which ccache does not cache — it would fall through to
          # the compiler on every file for the cost of a cache step.
          - name: macos-universal
            os: macos-latest
            preset: macos
          - name: linux-gcc
            os: ubuntu-latest
            preset: linux-gcc
            launcher: ccache
          - name: linux-clang
            os: ubuntu-latest
            preset: linux-clang
            launcher: ccache
          - name: wasm
            os: ubuntu-latest
            preset: wasm
            emscripten: true
    env:
      # CMake seeds CMAKE_<LANG>_COMPILER_LAUNCHER from the environment, so
      # ccache attaches itself without CI having to pass flags the presets
      # do not carry. Empty on the jobs that leave it out of the matrix.
      CMAKE_C_COMPILER_LAUNCHER: ${{ matrix.launcher }}
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.launcher }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Same reasoning as the guards job: build the contributor's head
          # commit, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # CMake, Ninja and node come with every runner image; only the SDL3
      # backend headers and the compilers have to be arranged for.
      #
      # SDL3's own README-linux dependency list, which is not optional: a
      # backend SDL wants and cannot find its headers for is a hard
      # configure error, not a silently dropped feature. Build the desktop
      # host with every backend a Linux player might need, or the green
      # light here means nothing.
      - name: SDL3 backend headers (X11, Wayland, audio, KMS, udev, D-Bus)
        if: runner.os == 'Linux' && !matrix.emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libjack-jackd2-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl-dev libegl-dev libgles-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev liburing-dev
      - name: MSVC developer environment (cl on PATH)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # The emsdk pin has one home, .emscripten-version, which README.md
      # tells contributors to install locally — CI must not drift from it.
      - name: Read the Emscripten pin
        id: emsdk-pin
        if: matrix.emscripten
        run: echo "version=$(cat .emscripten-version)" >> "$GITHUB_OUTPUT"
      - name: Emscripten ${{ steps.emsdk-pin.outputs.version }}
        if: matrix.emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ steps.emsdk-pin.outputs.version }}
          # The toolchain is a few hundred MB; caching it is most of this
          # job's wall time.
          actions-cache-folder: emsdk-${{ steps.emsdk-pin.outputs.version }}

      - name: ccache
        if: matrix.launcher == 'ccache'
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ matrix.name }}
          # Enough for SDL3 plus our own objects, which is what dominates a
          # cold build here.
          max-size: 500M

      # SDL3 is fetched at configure time (cmake/AmberfolioSDL3.cmake), and
      # a shallow clone of it on every push is pure waste. Only the source
      # and FetchContent's own bookkeeping are cached; the objects it
      # builds from that source are ccache's job.
      - name: Cache the SDL3 clone
        if: '!matrix.emscripten'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps/sdl3-src
            build/${{ matrix.preset }}/_deps/sdl3-subbuild
          key: sdl3-${{ matrix.name }}-${{ hashFiles('cmake/AmberfolioSDL3.cmake') }}

      # Same deal for GoogleTest (cmake/AmberfolioGoogleTest.cmake). Kept a
      # separate entry from SDL3's so bumping one pin does not re-clone the
      # other. The wasm job does not build the tests, so it needs neither.
      - name: Cache the GoogleTest clone
        if: '!matrix.emscripten'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps/googletest-src
            build/${{ matrix.preset }}/_deps/googletest-subbuild
          key: gtest-${{ matrix.name }}-${{ hashFiles('cmake/AmberfolioGoogleTest.cmake') }}

      # AMBERFOLIO_SOURCE_URL is the AGPL-3.0-only §13 source offer the web
      # page carries, pinned to the commit this build came from rather
      # than to a branch that will have moved on by the time anyone
      # follows it. Passed to every preset from this one shared step; only
      # the web host reads it (see the top-level CMakeLists).
      - name: configure
        run: >
          cmake --preset ${{ matrix.preset }}
          "-DAMBERFOLIO_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.event.pull_request.head.sha || github.sha }}"
      - name: build
        run: cmake --build --preset ${{ matrix.preset }}
      # On the native targets this is the GoogleTest suite (one CTest case
      # per test) plus the SDL host smoke check; on wasm it is the module
      # smoke check, which loads the module under node and asks it for its
      # version. A failing test fails the job — the presets set
      # outputOnFailure, so the assertion lands in the log.
      - name: test
        run: ctest --preset ${{ matrix.preset }}

      # What the deploy job ships (deploy/vercel/README.md). Uploaded on
      # every event rather than only on main, because a pull request from
      # this repository gets a preview deployment of exactly the bytes CI
      # just tested. smoke.mjs stays behind: it is the node check's
      # apparatus, and the deployed site is the page.
      - name: Upload the web host
        if: matrix.emscripten
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-host
          path: |
            build/wasm/hosts/web/Debug
            !build/wasm/hosts/web/Debug/smoke.mjs
          if-no-files-found: error
          retention-days: 7

  # ASan + UBSan over the test suite (PLAN.md §6). Its own job rather than
  # another row in the matrix above: it builds no host, so it needs none of
  # that job's SDL3 apparatus, and a sanitizer finding deserves to read as
  # its own signal rather than as "linux is broken".
  sanitizers:
    name: sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: linux-asan-ubsan
          # Smaller than the matrix jobs': no SDL3 in this build tree, so
          # it is our objects plus GoogleTest's.
          max-size: 200M
      - name: Cache the GoogleTest clone
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-asan-ubsan/_deps/googletest-src
            build/linux-asan-ubsan/_deps/googletest-subbuild
          key: gtest-asan-${{ hashFiles('cmake/AmberfolioGoogleTest.cmake') }}
      - name: configure
        run: cmake --preset linux-asan-ubsan
      - name: build
        run: cmake --build --preset linux-asan-ubsan
      # ASAN_OPTIONS and UBSAN_OPTIONS live in the test preset rather than
      # here, so a contributor running `ctest --preset linux-asan-ubsan`
      # gets the run CI got — including -fno-sanitize-recover, which is
      # what stops a real finding from printing and exiting 0.
      - name: test
        run: ctest --preset linux-asan-ubsan

  # Publish the wasm host. Built in Actions and deployed prebuilt: the
  # matrix job above already has the pinned emsdk and its cache, and
  # pinning the toolchain a second time in Vercel's settings would be a
  # second source of truth waiting to drift. deploy/vercel/README.md has
  # the reasoning and the one-time project setup.
  deploy:
    name: deploy (wasm host)
    # Nothing ships past a red gate — including a red sanitizer run and a
    # target other than wasm: a module published while linux is broken is
    # not a state worth putting a public URL on.
    needs: [guards, tidy, build, sanitizers]
    runs-on: ubuntu-latest
    # Two pushes in quick succession should leave the later one live
    # rather than race for it.
    concurrency:
      group: deploy-${{ github.event.pull_request.head.ref || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Production for main, a preview for a pull request from this
      # repository, nothing otherwise. Two cases deliberately pass rather
      # than fail: a fork's pull request, which must never reach the
      # secrets, and a repository that has not been given them yet. Both
      # decide it here rather than in the job's `if:` so the reason lands
      # in the log — a skipped job explains nothing to the person reading
      # it. (`secrets` is not available to a job-level `if` anyway.)
      - name: What does this run deploy?
        id: target
        env:
          # A boolean, not the secret: this only asks whether the
          # repository has been given one.
          HAVE_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          # Not merely "is this a pull request" — a fork's head repository
          # is a different one, and that is the case that must never see a
          # secret. One line because a folded YAML scalar would leave a
          # newline inside the expression.
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          target=none
          if [ "$IS_FORK_PR" = true ]; then
            reason="pull request from a fork — the deployment secrets are not exposed to it"
          elif [ "$HAVE_TOKEN" != true ]; then
            reason="VERCEL_TOKEN is not set on this repository (see deploy/vercel/README.md)"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            target=production
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            target=preview
          else
            reason="only main is published; a pull request from this repository gets a preview"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [ "$target" = none ]; then
            echo "not deploying: $reason"
            echo "Not deploying: $reason." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploying: $target"
          fi

      - name: Download the web host the wasm job built
        if: steps.target.outputs.target != 'none'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-host
          path: .vercel/output/static

      # The header and routing policy, in the form a prebuilt deployment
      # reads it — Vercel's build, and with it any vercel.json, is exactly
      # what this pipeline skips. The listing is the audit trail: what
      # ships is the wasm build tree and nothing else, and it is worth
      # being able to see that on any given deployment.
      - name: Stage the deployment
        if: steps.target.outputs.target != 'none'
        run: |
          cp deploy/vercel/config.json .vercel/output/config.json
          cd .vercel/output/static
          echo 'files to be deployed:'
          find . -type f | sort
          {
            echo '### Deployment contents'
            echo
            echo '```'
            find . -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Pinned like every other toolchain here: a deploy that starts
      # behaving differently should be a commit, not a Tuesday.
      - name: Vercel CLI
        if: steps.target.outputs.target != 'none'
        run: npm install --global vercel@59.1.3

      - name: Deploy
        if: steps.target.outputs.target != 'none'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          # --prebuilt: ship .vercel/output as it stands, build nothing.
          # The "did you mean the subdirectory deploy/?" warning this
          # prints is this repository's own deploy/ directory being
          # noticed, not a mistake; the subcommand still wins.
          args=(deploy --prebuilt --yes --token "$VERCEL_TOKEN")
          if [ "$TARGET" = production ]; then
            args+=(--prod)
          fi
          # Progress goes to stderr and the deployment URL to stdout —
          # but not always alone: the CLI switches to a JSON summary when
          # it decides its caller is a machine. Rather than bet on which
          # form CI gets, take the first deployment host out of whatever
          # arrives, and never let a parse miss fail a deploy that
          # already happened.
          out=$(vercel "${args[@]}")
          printf '%s\n' "$out"
          url=$(printf '%s\n' "$out" \
            | grep -Eom1 'https://[a-z0-9.-]+\.vercel\.app' || true)
          {
            echo "### Deployed — $TARGET"
            echo
            if [ -n "$url" ]; then
              echo "$url"
            else
              echo 'Deployed, but the CLI output held no URL to quote:'
              echo
              echo '```'
              printf '%s\n' "$out"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  acknowledgments:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR template acknowledgments are checked
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Normalize: lowercase, strip markdown bold, collapse whitespace.
          norm=$(printf '%s' "$BODY" \
            | tr '[:upper:]' '[:lower:]' | tr -d '*' | tr -s '[:space:]' ' ')
          ok=1
          for need in \
            "- [x] i license this contribution under the apache license 2.0" \
            "- [x] this contribution contains no material from the original games"
          do
            if ! printf '%s' "$norm" | grep -qF -- "$need"; then
              echo "FAIL: missing checked acknowledgment: \"$need\""
              ok=0
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "Both acknowledgments in the pull-request template must be"
            echo "present and checked ([x]) — see CONTRIBUTING.md."
            exit 1
          fi
          echo "acknowledgments: OK"
