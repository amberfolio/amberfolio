# SPDX-License-Identifier: AGPL-3.0-only
name: ci
on:
  push:
  pull_request:
    # "edited" is not a default activity type, but the acknowledgments
    # job reads the PR body, which the author may fix after opening.
    types: [opened, synchronize, reopened, edited]
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On pull_request the default checkout is GitHub's synthetic
          # merge commit, which carries no Signed-off-by; guard the PR
          # head instead so the DCO check sees the contributor's commits.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: guard self-test (negative cases)
        run: bash scripts/test-guards.sh
      - name: content guard (every commit + index + working tree)
        run: bash scripts/check-clean.sh
      - name: DCO check (every non-merge commit)
        run: bash scripts/check-dco.sh
  acknowledgments:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR template acknowledgments are checked
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Normalize: lowercase, strip markdown bold, collapse whitespace.
          norm=$(printf '%s' "$BODY" \
            | tr '[:upper:]' '[:lower:]' | tr -d '*' | tr -s '[:space:]' ' ')
          ok=1
          for need in \
            "- [x] i license this contribution under the apache license 2.0" \
            "- [x] this contribution contains no material from the original games"
          do
            if ! printf '%s' "$norm" | grep -qF -- "$need"; then
              echo "FAIL: missing checked acknowledgment: \"$need\""
              ok=0
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "Both acknowledgments in the pull-request template must be"
            echo "present and checked ([x]) — see CONTRIBUTING.md."
            exit 1
          fi
          echo "acknowledgments: OK"
