# SPDX-License-Identifier: AGPL-3.0-only
name: ci
on:
  push:
  pull_request:
    # "edited" is not a default activity type, but the acknowledgments
    # job reads the PR body, which the author may fix after opening.
    types: [opened, synchronize, reopened, edited]

# The conformance vector cache (issue #14). Written out here rather than
# taken from a job output because every job that restores it needs it,
# and threading one string through the job graph is more machinery than
# the string is worth. It must equal what the fetch script computes from
# the suite pin and the condenser version — the `vectors` job asserts
# exactly that and fails loudly if the two ever drift, so the literal
# cannot go stale unnoticed.
env:
  CONFORMANCE_CACHE_KEY: conformance-v2-aea84484abc7-c1

# Every job below carries a `timeout-minutes:`. GitHub's default is 360,
# which is less a timeout than an afternoon: a step that hangs — and the
# apt install of SDL3's backend headers has, on three separate runs —
# leaves a job that looks alive for six hours and then fails with nothing
# in the log to explain it, long after whoever pushed has stopped
# watching. The numbers are several times the slowest healthy run of each
# job, cold caches included, so they cannot fire on a slow day; they exist
# to turn a hung runner into a red mark that can be re-run in a minute.
#
# Deliberately per job rather than one number: the jobs differ by an order
# of magnitude, and a single value generous enough for the build matrix
# would let the four-second acknowledgments job hang all morning.
jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On pull_request the default checkout is GitHub's synthetic
          # merge commit, which carries no Signed-off-by; guard the PR
          # head instead so the DCO check sees the contributor's commits.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # clang-format is pinned so CI and a contributor's machine reach the
      # same verdict; the wheel is the one install that works identically
      # on all three desktop platforms, which is what CONTRIBUTING.md
      # tells people to use. shellcheck comes with the runner image.
      #
      # setup-python rather than the system one: Ubuntu's is marked
      # externally-managed (PEP 668) and refuses a plain pip install.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: clang-format (pinned by .llvm-version)
        run: pip install "clang-format==$(cat .llvm-version)"
      # Before the gates themselves, because a gate that cannot fail is
      # worse than no gate: this asserts each one rejects what it exists
      # to reject.
      - name: guard self-test (negative cases)
        run: bash scripts/test-guards.sh
      - name: content guard (every commit + index + working tree)
        run: bash scripts/check-clean.sh
      - name: DCO check (every non-merge commit)
        run: bash scripts/check-dco.sh
      - name: format check (clang-format over tracked C++)
        run: bash scripts/check-format.sh
      - name: shell lint (shellcheck over scripts/)
        run: bash scripts/check-shell.sh

  # Separate from the guards job because it is the only gate that needs a
  # configured build tree — clang-tidy reads the compile database and the
  # generated headers. Configure only: `cmake --preset` fetches the
  # dependencies and runs configure_file, which is everything tidy needs,
  # so this job never compiles a translation unit.
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: SDL3 backend headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libjack-jackd2-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl-dev libegl-dev libgles-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev liburing-dev
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: clang-tidy (pinned by .llvm-version)
        run: pip install "clang-tidy==$(cat .llvm-version)"
      - name: Cache the SDL3 clone
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-clang/_deps/sdl3-src
            build/linux-clang/_deps/sdl3-subbuild
          key: sdl3-tidy-${{ hashFiles('cmake/AmberfolioSDL3.cmake') }}
      - name: Cache the GoogleTest clone
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-clang/_deps/googletest-src
            build/linux-clang/_deps/googletest-subbuild
          key: gtest-tidy-${{ hashFiles('cmake/AmberfolioGoogleTest.cmake') }}
      - name: Cache the conformance dependency clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-clang/_deps/simdjson-src
            build/linux-clang/_deps/simdjson-subbuild
            build/linux-clang/_deps/libdeflate-src
            build/linux-clang/_deps/libdeflate-subbuild
          key: conformance-deps-tidy-${{ hashFiles('cmake/AmberfolioConformance.cmake') }}
      - name: configure (for the compile database)
        run: cmake --preset linux-clang
      - name: clang-tidy
        run: bash scripts/check-tidy.sh build/linux-clang

  # The CPU conformance oracle (issue #14). SingleStepTests/8088 is
  # 726 MB at the pinned commit; the fetch script takes it in one sparse
  # partial clone and condenses it to about 300 MB on the way in, and
  # that is what gets cached — keyed on the suite commit and the
  # condenser version together, so changing either is a new cache rather
  # than a stale one silently reused.
  #
  # Once per operating system, not once per job: an Actions cache cannot
  # be restored on an OS other than the one that saved it, so a single
  # Linux job cannot supply the Windows and macOS builds however much one
  # would like it to. Three legs here is still far better than the six
  # jobs that would otherwise each fetch and condense for themselves.
  #
  # Every job that runs vectors depends on this one, which costs them the
  # half-minute a cache hit takes.
  vectors:
    name: conformance vectors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Git Bash on the Windows leg, so these steps are one script
        # rather than one per shell.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # For the fetch script, and so that `python` means the same thing
      # on all three runners.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # The script is the single source of truth for the suite pin and
      # the condensed layout. The workflow repeats its cache key at the
      # top of this file because every job needs it; this is what stops
      # the copy from drifting away from the original.
      - name: The cache key still matches the pin
        run: |
          want="conformance-$(python scripts/fetch-conformance-vectors.py --print-key)"
          if [ "$want" != "$CONFORMANCE_CACHE_KEY" ]; then
            echo "the workflow's CONFORMANCE_CACHE_KEY is $CONFORMANCE_CACHE_KEY,"
            echo "but scripts/fetch-conformance-vectors.py says $want."
            echo "Update the env: block at the top of this file."
            exit 1
          fi
          echo "cache key: $CONFORMANCE_CACHE_KEY"
      - name: Where the vectors go
        run: |
          echo "AMBERFOLIO_CONFORMANCE_VECTORS=$RUNNER_TEMP/conformance-vectors" \
            >> "$GITHUB_ENV"
      # lookup-only: this job only has to know whether the cache exists.
      # Downloading 300 MB to find that out, on every push, would be most
      # of its wall time on the path that has nothing to do.
      - name: Is the condensed set already cached?
        id: probe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance-vectors
          key: ${{ env.CONFORMANCE_CACHE_KEY }}
          lookup-only: true
      - name: Fetch and condense
        if: steps.probe.outputs.cache-hit != 'true'
        run: python scripts/fetch-conformance-vectors.py
      - name: Cache the condensed set
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance-vectors
          key: ${{ env.CONFORMANCE_CACHE_KEY }}

  # M1's exit criterion (PLAN.md §7), and now the thing that keeps it
  # true: the whole suite, every vector of all 323 files, on every push. Its own job rather than a
  # row in the build matrix because it is the one run with nothing capped,
  # and because a conformance failure deserves to read as itself rather
  # than as "linux is broken".
  #
  # No SDL host here: this job builds the core and the test binaries and
  # nothing else, which saves it the whole backend-header apparatus the
  # matrix job needs.
  conformance:
    name: conformance (full suite)
    needs: [vectors]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: conformance
          max-size: 300M
      - name: Cache the GoogleTest clone
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-gcc/_deps/googletest-src
            build/linux-gcc/_deps/googletest-subbuild
          key: gtest-conformance-${{ hashFiles('cmake/AmberfolioGoogleTest.cmake') }}
      - name: Cache the conformance dependency clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-gcc/_deps/simdjson-src
            build/linux-gcc/_deps/simdjson-subbuild
            build/linux-gcc/_deps/libdeflate-src
            build/linux-gcc/_deps/libdeflate-subbuild
          key: conformance-deps-${{ hashFiles('cmake/AmberfolioConformance.cmake') }}
      - name: Where the vectors are
        run: |
          echo "AMBERFOLIO_CONFORMANCE_VECTORS=$RUNNER_TEMP/conformance-vectors" \
            >> "$GITHUB_ENV"
      # fail-on-cache-miss: without the vectors the suite reports every
      # file as skipped and exits 0, which is precisely the silent pass
      # this job exists to prevent. (AMBERFOLIO_CONFORMANCE_REQUIRED below
      # is the same argument one level down, for a cache that restored
      # something incomplete.)
      - name: Restore the condensed vectors
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance-vectors
          key: ${{ env.CONFORMANCE_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: configure
        run: cmake --preset linux-gcc -DAMBERFOLIO_BUILD_HOST_SDL=OFF
      - name: build
        run: cmake --build --preset linux-gcc
      - name: conformance suite
        env:
          AMBERFOLIO_CONFORMANCE_REQUIRED: '1'
        run: ctest --preset linux-gcc -L conformance
  # Every target, every push. The jobs deliberately run the same three
  # commands a contributor runs locally — cmake --preset / --build --preset
  # / ctest --preset — so a green matrix means the documented workflow
  # works, not just some CI-only incantation.
  build:
    name: build (${{ matrix.name }})
    # For the conformance vectors: the native rows run a capped subset of
    # the suite, so a family that only breaks under a different compiler
    # is caught here rather than by the linux-gcc job alone. The wasm row
    # needs nothing from it and waits anyway, which is the price of a
    # job-level dependency.
    needs: [vectors]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One broken target should not hide the state of the other four.
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            preset: windows-msvc
          # No ccache here: the universal preset compiles with two -arch
          # flags, which ccache does not cache — it would fall through to
          # the compiler on every file for the cost of a cache step.
          - name: macos-universal
            os: macos-latest
            preset: macos
          - name: linux-gcc
            os: ubuntu-latest
            preset: linux-gcc
            launcher: ccache
          - name: linux-clang
            os: ubuntu-latest
            preset: linux-clang
            launcher: ccache
          - name: wasm
            os: ubuntu-latest
            preset: wasm
            emscripten: true
    env:
      # CMake seeds CMAKE_<LANG>_COMPILER_LAUNCHER from the environment, so
      # ccache attaches itself without CI having to pass flags the presets
      # do not carry. Empty on the jobs that leave it out of the matrix.
      CMAKE_C_COMPILER_LAUNCHER: ${{ matrix.launcher }}
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.launcher }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Same reasoning as the guards job: build the contributor's head
          # commit, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # CMake, Ninja and node come with every runner image; only the SDL3
      # backend headers and the compilers have to be arranged for.
      #
      # SDL3's own README-linux dependency list, which is not optional. A
      # partly-installed backend is a hard configure error (SDL's
      # SDL_missing_dependency is FATAL_ERROR on Linux); a wholly absent one
      # is dropped without a word, which is the worse case — it builds green
      # on a host that cannot open a window. Install the lot: the desktop
      # host has to carry every backend a Linux player might need, or the
      # green light here means nothing.
      - name: SDL3 backend headers (X11, Wayland, audio, KMS, udev, D-Bus)
        if: runner.os == 'Linux' && !matrix.emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libjack-jackd2-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl-dev libegl-dev libgles-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev liburing-dev
      - name: MSVC developer environment (cl on PATH)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # The emsdk pin has one home, .emscripten-version, which README.md
      # tells contributors to install locally — CI must not drift from it.
      - name: Read the Emscripten pin
        id: emsdk-pin
        if: matrix.emscripten
        run: echo "version=$(cat .emscripten-version)" >> "$GITHUB_OUTPUT"
      - name: Emscripten ${{ steps.emsdk-pin.outputs.version }}
        if: matrix.emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ steps.emsdk-pin.outputs.version }}
          # The toolchain is a few hundred MB; caching it is most of this
          # job's wall time.
          actions-cache-folder: emsdk-${{ steps.emsdk-pin.outputs.version }}

      - name: ccache
        if: matrix.launcher == 'ccache'
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ matrix.name }}
          # Enough for SDL3 plus our own objects, which is what dominates a
          # cold build here.
          max-size: 500M

      # SDL3 is fetched at configure time (cmake/AmberfolioSDL3.cmake), and
      # a shallow clone of it on every push is pure waste. Only the source
      # and FetchContent's own bookkeeping are cached; the objects it
      # builds from that source are ccache's job.
      - name: Cache the SDL3 clone
        if: '!matrix.emscripten'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps/sdl3-src
            build/${{ matrix.preset }}/_deps/sdl3-subbuild
          key: sdl3-${{ matrix.name }}-${{ hashFiles('cmake/AmberfolioSDL3.cmake') }}

      # Same deal for GoogleTest (cmake/AmberfolioGoogleTest.cmake). Kept a
      # separate entry from SDL3's so bumping one pin does not re-clone the
      # other. The wasm job does not build the tests, so it needs neither.
      - name: Cache the GoogleTest clone
        if: '!matrix.emscripten'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps/googletest-src
            build/${{ matrix.preset }}/_deps/googletest-subbuild
          key: gtest-${{ matrix.name }}-${{ hashFiles('cmake/AmberfolioGoogleTest.cmake') }}

      # The conformance harness's two libraries (issue #14). One entry for
      # both: they are pinned in one file, so one hash decides both.
      - name: Cache the conformance dependency clones
        if: '!matrix.emscripten'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/${{ matrix.preset }}/_deps/simdjson-src
            build/${{ matrix.preset }}/_deps/simdjson-subbuild
            build/${{ matrix.preset }}/_deps/libdeflate-src
            build/${{ matrix.preset }}/_deps/libdeflate-subbuild
          key: conformance-deps-${{ matrix.name }}-${{ hashFiles('cmake/AmberfolioConformance.cmake') }}

      # A capped subset on the native targets: enough to catch a family
      # that behaves differently under another compiler, far short of the
      # eight minutes the full set would cost four more times. The
      # uncapped run is the `conformance` job. wasm builds no tests at all
      # (PLAN.md §6 — the conformance suite runs on native CI), so it
      # takes neither the vectors nor the cap.
      - name: Where the vectors are
        if: '!matrix.emscripten'
        shell: bash
        run: |
          echo "AMBERFOLIO_CONFORMANCE_VECTORS=$RUNNER_TEMP/conformance-vectors" \
            >> "$GITHUB_ENV"
      - name: Restore the condensed vectors
        if: '!matrix.emscripten'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance-vectors
          key: ${{ env.CONFORMANCE_CACHE_KEY }}
          fail-on-cache-miss: true

      # AMBERFOLIO_SOURCE_URL is the AGPL-3.0-only §13 source offer the web
      # page carries, pinned to the commit this build came from rather
      # than to a branch that will have moved on by the time anyone
      # follows it. Passed to every preset from this one shared step; only
      # the web host reads it (see the top-level CMakeLists).
      - name: configure
        run: >
          cmake --preset ${{ matrix.preset }}
          "-DAMBERFOLIO_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.event.pull_request.head.sha || github.sha }}"
      - name: build
        run: cmake --build --preset ${{ matrix.preset }}
      # On the native targets this is the GoogleTest suite (one CTest case
      # per test) plus the SDL host smoke check; on wasm it is the module
      # smoke check, which loads the module under node and asks it for its
      # version. Both also run the self-written 8086 programs
      # (tests/programs), which is the only thing that runs the
      # interpreter on the wasm target rather than only building it. A
      # failing test fails the job — the presets set outputOnFailure, so
      # the assertion lands in the log.
      - name: test
        env:
          AMBERFOLIO_CONFORMANCE_LIMIT: '500'
          AMBERFOLIO_CONFORMANCE_REQUIRED: ${{ matrix.emscripten && '' || '1' }}
        run: ctest --preset ${{ matrix.preset }}

      # What the deploy job ships (deploy/vercel/README.md). Uploaded on
      # every event rather than only on main, because a pull request from
      # this repository gets a preview deployment of exactly the bytes CI
      # just tested. smoke.mjs stays behind: it is the node check's
      # apparatus, and the deployed site is the page.
      - name: Upload the web host
        if: matrix.emscripten
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-host
          path: |
            build/wasm/hosts/web/Debug
            !build/wasm/hosts/web/Debug/smoke.mjs
          if-no-files-found: error
          retention-days: 7

  # ASan + UBSan over the test suite (PLAN.md §6). Its own job rather than
  # another row in the matrix above: it builds no host, so it needs none of
  # that job's SDL3 apparatus, and a sanitizer finding deserves to read as
  # its own signal rather than as "linux is broken".
  sanitizers:
    name: sanitizers (ASan + UBSan)
    needs: [vectors]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: linux-asan-ubsan
          # Smaller than the matrix jobs': no SDL3 in this build tree, so
          # it is our objects plus GoogleTest's.
          max-size: 200M
      - name: Cache the GoogleTest clone
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-asan-ubsan/_deps/googletest-src
            build/linux-asan-ubsan/_deps/googletest-subbuild
          key: gtest-asan-${{ hashFiles('cmake/AmberfolioGoogleTest.cmake') }}
      - name: Cache the conformance dependency clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-asan-ubsan/_deps/simdjson-src
            build/linux-asan-ubsan/_deps/simdjson-subbuild
            build/linux-asan-ubsan/_deps/libdeflate-src
            build/linux-asan-ubsan/_deps/libdeflate-subbuild
          key: conformance-deps-asan-${{ hashFiles('cmake/AmberfolioConformance.cmake') }}
      - name: Where the vectors are
        run: |
          echo "AMBERFOLIO_CONFORMANCE_VECTORS=$RUNNER_TEMP/conformance-vectors" \
            >> "$GITHUB_ENV"
      - name: Restore the condensed vectors
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance-vectors
          key: ${{ env.CONFORMANCE_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: configure
        run: cmake --preset linux-asan-ubsan
      - name: build
        run: cmake --build --preset linux-asan-ubsan
      # ASAN_OPTIONS and UBSAN_OPTIONS live in the test preset rather than
      # here, so a contributor running `ctest --preset linux-asan-ubsan`
      # gets the run CI got — including -fno-sanitize-recover, which is
      # what stops a real finding from printing and exiting 0.
      #
      # A hundred vectors per file rather than five hundred: instrumented
      # code is an order of magnitude slower, and what this job is looking
      # for — a bad index, an uninitialised read — shows up in the first
      # hundred or not at all.
      - name: test
        env:
          AMBERFOLIO_CONFORMANCE_LIMIT: '100'
          AMBERFOLIO_CONFORMANCE_REQUIRED: '1'
        run: ctest --preset linux-asan-ubsan

  # Publish the wasm host. Built in Actions and deployed prebuilt: the
  # matrix job above already has the pinned emsdk and its cache, and
  # pinning the toolchain a second time in Vercel's settings would be a
  # second source of truth waiting to drift. deploy/vercel/README.md has
  # the reasoning and the one-time project setup.
  deploy:
    name: deploy (wasm host)
    # Nothing ships past a red gate — including a red sanitizer run, a red
    # conformance run, and a target other than wasm: a module published
    # while linux is broken is not a state worth putting a public URL on.
    needs: [guards, tidy, build, sanitizers, conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two pushes in quick succession should leave the later one live
    # rather than race for it.
    concurrency:
      group: deploy-${{ github.event.pull_request.head.ref || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Production for main, a preview for a pull request from this
      # repository, nothing otherwise. Two cases deliberately pass rather
      # than fail: a fork's pull request, which must never reach the
      # secrets, and a repository that has not been given them yet. Both
      # decide it here rather than in the job's `if:` so the reason lands
      # in the log — a skipped job explains nothing to the person reading
      # it. (`secrets` is not available to a job-level `if` anyway.)
      - name: What does this run deploy?
        id: target
        env:
          # A boolean, not the secret: this only asks whether the
          # repository has been given one.
          HAVE_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          # Not merely "is this a pull request" — a fork's head repository
          # is a different one, and that is the case that must never see a
          # secret. One line because a folded YAML scalar would leave a
          # newline inside the expression.
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          target=none
          if [ "$IS_FORK_PR" = true ]; then
            reason="pull request from a fork — the deployment secrets are not exposed to it"
          elif [ "$HAVE_TOKEN" != true ]; then
            reason="VERCEL_TOKEN is not set on this repository (see deploy/vercel/README.md)"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            target=production
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            target=preview
          else
            reason="only main is published; a pull request from this repository gets a preview"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [ "$target" = none ]; then
            echo "not deploying: $reason"
            echo "Not deploying: $reason." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploying: $target"
          fi

      - name: Download the web host the wasm job built
        if: steps.target.outputs.target != 'none'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-host
          path: .vercel/output/static

      # The header and routing policy, in the form a prebuilt deployment
      # reads it — Vercel's build, and with it any vercel.json, is exactly
      # what this pipeline skips. The listing is the audit trail: what
      # ships is the wasm build tree and nothing else, and it is worth
      # being able to see that on any given deployment.
      - name: Stage the deployment
        if: steps.target.outputs.target != 'none'
        run: |
          cp deploy/vercel/config.json .vercel/output/config.json
          cd .vercel/output/static
          echo 'files to be deployed:'
          find . -type f | sort
          {
            echo '### Deployment contents'
            echo
            echo '```'
            find . -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Pinned like every other toolchain here: a deploy that starts
      # behaving differently should be a commit, not a Tuesday.
      - name: Vercel CLI
        if: steps.target.outputs.target != 'none'
        run: npm install --global vercel@59.1.3

      - name: Deploy
        if: steps.target.outputs.target != 'none'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          # --prebuilt: ship .vercel/output as it stands, build nothing.
          # The "did you mean the subdirectory deploy/?" warning this
          # prints is this repository's own deploy/ directory being
          # noticed, not a mistake; the subcommand still wins.
          args=(deploy --prebuilt --yes --token "$VERCEL_TOKEN")
          if [ "$TARGET" = production ]; then
            args+=(--prod)
          fi
          # Progress goes to stderr and the deployment URL to stdout —
          # but not always alone: the CLI switches to a JSON summary when
          # it decides its caller is a machine. Rather than bet on which
          # form CI gets, take the first deployment host out of whatever
          # arrives, and never let a parse miss fail a deploy that
          # already happened.
          out=$(vercel "${args[@]}")
          printf '%s\n' "$out"
          url=$(printf '%s\n' "$out" \
            | grep -Eom1 'https://[a-z0-9.-]+\.vercel\.app' || true)
          {
            echo "### Deployed — $TARGET"
            echo
            if [ -n "$url" ]; then
              echo "$url"
            else
              echo 'Deployed, but the CLI output held no URL to quote:'
              echo
              echo '```'
              printf '%s\n' "$out"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  acknowledgments:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR template acknowledgments are checked
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Normalize: lowercase, strip markdown bold, collapse whitespace.
          norm=$(printf '%s' "$BODY" \
            | tr '[:upper:]' '[:lower:]' | tr -d '*' | tr -s '[:space:]' ' ')
          ok=1
          for need in \
            "- [x] i license this contribution under the apache license 2.0" \
            "- [x] this contribution contains no material from the original games"
          do
            if ! printf '%s' "$norm" | grep -qF -- "$need"; then
              echo "FAIL: missing checked acknowledgment: \"$need\""
              ok=0
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "Both acknowledgments in the pull-request template must be"
            echo "present and checked ([x]) — see CONTRIBUTING.md."
            exit 1
          fi
          echo "acknowledgments: OK"
